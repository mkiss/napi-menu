name: Napi menü frissítése

on:
  schedule:
    # UTC idő! 7:00 és 9:00 UTC = 9:00 és 11:00 nyári időben (télen 8:00 és 10:00)
    - cron: "0 7,9 * * *"
  workflow_dispatch: {}   # kézi indítás az Actions fülön

permissions:
  contents: write

jobs:
  frissites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scrape.py
      - name: Mentés
        run: |
          git config user.name "menu-bot"
          git config user.email "menu-bot@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || (git commit -m "Menü frissítése $(date +%F)" && git push)
